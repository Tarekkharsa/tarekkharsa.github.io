<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Tarek Kharsa</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --paper: #FBFAF7;
    --ink: #1B1F24;
    --muted: #5B6570;
    --faint: #8A929B;
    --accent: #B4540A;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14171B;
      --ink: #E9E7E2;
      --muted: #9AA3AC;
      --faint: #737C85;
      --accent: #F0975A;
    }
  }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.65 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover, a:focus-visible { text-decoration: underline; text-underline-offset: 3px; }
  main {
    max-width: 42rem;
    margin: 0 auto;
    padding: clamp(3rem, 9vh, 6rem) 1.35rem 4.5rem;
  }
  .prompt { font-family: var(--mono); font-size: 0.82rem; color: var(--faint); margin: 0 0 0.9rem; }
  .prompt .dollar { color: var(--accent); }
  h1 {
    font-family: var(--mono);
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    line-height: 1.15;
    letter-spacing: -0.03em;
    margin: 0 0 1rem;
  }
  h1 .accent { color: var(--accent); }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="prompt"><span class="dollar">$</span> cat this-page</p>
  <h1>404 — not found<span class="accent">.</span></h1>
  <p>That page does not exist. <a href="/">← Back home</a></p>
</main>
</body>
</html>
